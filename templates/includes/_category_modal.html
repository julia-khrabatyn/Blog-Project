
{% load i18n %}
<div
    id="category-modal"
    data-url="{% url 'category_ajax_create'%}"
    class="hidden fixed inset-0 bg-black/50"
>
    <div class="bg-white p-6 rounded-lg max-w-md mx-auto mt-20">

        <input
            type="text"
            id="cat-title"
            class="w-full border p-2"
        >

        <button id="save-category">{% trans "Save" %}</button>
        <button id="close-category-modal">{% trans "Close" %}</button>

    </div>
</div>
