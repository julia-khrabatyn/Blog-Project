{% load static %}
{% load i18n %}

<label class="container">
    <input
        type="checkbox"
        class="like-checkbox"
        data-url="{% url 'post_like' post.pk %}"
        {% if post.is_liked %}checked{% endif %}
    />

    <svg class="checkmark" viewBox="0 0 24 24">
        <path d="M12 21s-6.716-4.686-9.5-8.5C.5 10.5 2.5 6.5 6.5 6.5c2 0 3.5 1.5 3.5 3.5 0-2 1.5-3.5 3.5-3.5 4 0 6 4 4 6-2.784 3.814-9.5 8.5-9.5 8.5z"/>
    </svg>
</label>
