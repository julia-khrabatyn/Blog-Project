{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% load user_tags %}

{% csrf_token %}

<label for="id_avatar" style="cursor:pointer;">
    <img id="avatar"
         src="{% get_user_avatar profile_user %}"
         alt="avatar"
         style="width:120px; height:120px; border-radius:50%;">
</label>

<input type="file"
       id="id_avatar"
       name="avatar"
       hidden>
